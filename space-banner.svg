<svg xmlns="http://www.w3.org/2000/svg" width="800" height="240" viewBox="0 0 800 240">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0620"/>
      <stop offset="0.55" stop-color="#1b0f3f"/>
      <stop offset="1" stop-color="#4a2394"/>
    </linearGradient>
    <radialGradient id="planet" cx="35%" cy="35%" r="70%">
      <stop offset="0" stop-color="#e9c8ff"/>
      <stop offset="1" stop-color="#6a2fb8"/>
    </radialGradient>
    <linearGradient id="txt" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f3e8ff"/>
      <stop offset="1" stop-color="#c084fc"/>
    </linearGradient>
  </defs>

  <rect width="800" height="240" rx="16" fill="url(#bg)"/>

  <!-- twinkling stars -->
  <g fill="#ffffff">
    <circle cx="40" cy="30" r="1.5"><animate attributeName="opacity" values="1;0.2;1" dur="2s" repeatCount="indefinite"/></circle>
    <circle cx="120" cy="200" r="1.2"><animate attributeName="opacity" values="0.3;1;0.3" dur="3s" repeatCount="indefinite"/></circle>
    <circle cx="210" cy="50" r="2"><animate attributeName="opacity" values="1;0.1;1" dur="2.5s" repeatCount="indefinite"/></circle>
    <circle cx="300" cy="190" r="1.3"><animate attributeName="opacity" values="0.2;1;0.2" dur="1.8s" repeatCount="indefinite"/></circle>
    <circle cx="380" cy="40" r="1.6"><animate attributeName="opacity" values="1;0.3;1" dur="3.2s" repeatCount="indefinite"/></circle>
    <circle cx="450" cy="210" r="2"><animate attributeName="opacity" values="0.4;1;0.4" dur="2.2s" repeatCount="indefinite"/></circle>
    <circle cx="520" cy="60" r="1.2"><animate attributeName="opacity" values="1;0.2;1" dur="2.8s" repeatCount="indefinite"/></circle>
    <circle cx="560" cy="170" r="1.5"><animate attributeName="opacity" values="0.2;1;0.2" dur="2.1s" repeatCount="indefinite"/></circle>
    <circle cx="760" cy="40" r="1.8"><animate attributeName="opacity" values="1;0.3;1" dur="2.6s" repeatCount="indefinite"/></circle>
    <circle cx="770" cy="200" r="1.3"><animate attributeName="opacity" values="0.3;1;0.3" dur="3.4s" repeatCount="indefinite"/></circle>
    <circle cx="90" cy="110" r="1" ><animate attributeName="opacity" values="1;0.2;1" dur="1.6s" repeatCount="indefinite"/></circle>
    <circle cx="470" cy="120" r="1.1"><animate attributeName="opacity" values="0.2;1;0.2" dur="2.4s" repeatCount="indefinite"/></circle>
  </g>

  <!-- shooting star -->
  <g>
    <line x1="0" y1="0" x2="-40" y2="-16" stroke="#e9d5ff" stroke-width="2" stroke-linecap="round"/>
    <animateTransform attributeName="transform" type="translate"
      values="420,30; 620,110" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;1;0" dur="4s" repeatCount="indefinite"/>
  </g>

  <!-- planet with ring and orbiting moon -->
  <ellipse cx="660" cy="125" rx="62" ry="14" fill="none" stroke="#c084fc" stroke-width="3" opacity="0.6" transform="rotate(-18 660 125)"/>
  <circle cx="660" cy="125" r="36" fill="url(#planet)"/>
  <g>
    <animateTransform attributeName="transform" type="rotate" from="0 660 125" to="360 660 125" dur="9s" repeatCount="indefinite"/>
    <circle cx="718" cy="125" r="6" fill="#f3e8ff"/>
  </g>

  <!-- text -->
  <text x="64" y="168" font-family="Verdana, sans-serif" font-size="18" letter-spacing="3" fill="#b794f4">
     Enchantè! I'm Hannay...
    <animate attributeName="opacity" values="0;1" dur="3s" fill="freeze"/>
  </text>
</svg>
